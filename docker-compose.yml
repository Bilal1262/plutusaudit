services:
  db:
    image: postgres:16-alpine
    container_name: veridian_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASS:-password}
      POSTGRES_DB: veridian
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veridian"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: veridian_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${PG_PASS:-password}@db:5432/veridian
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Mount RAG index + data so the host can rebuild without rebuilding the image
      - ./backend/rag:/app/backend/rag
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: veridian_web
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
